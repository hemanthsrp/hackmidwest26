# Local stack: builds every image from this checkout, runs its own Postgres and
# binds host ports to loopback. Shared settings live in compose.base.yml.
#
#   docker compose -f compose.frontend.yml up --build -d

services:
  database:
    extends: { file: compose.base.yml, service: database }
    environment:
      POSTGRES_PASSWORD: localdev
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5433}:5432"
    volumes:
      - folio-local-data:/var/lib/postgresql/data

  frontend-migrations:
    extends: { file: compose.base.yml, service: frontend-migrations }
    build:
      context: ./frontend
      target: migrator
    environment:
      DATABASE_URL: postgresql://folio:localdev@database:5432/folio

  scraper-schema:
    extends: { file: compose.base.yml, service: scraper-schema }
    build:
      context: .
      dockerfile: microservices/scraper-analysis/Dockerfile
    env_file:
      - path: ./microservices/scraper-analysis/.env
        required: false
    environment:
      DATABASE_URL: postgresql://folio:localdev@database:5432/folio

  scraper-analysis:
    extends: { file: compose.base.yml, service: scraper-analysis }
    build:
      context: .
      dockerfile: microservices/scraper-analysis/Dockerfile
    env_file:
      - path: ./microservices/scraper-analysis/.env
        required: false
    environment:
      DATABASE_URL: postgresql://folio:localdev@database:5432/folio

  volatility:
    extends: { file: compose.base.yml, service: volatility }
    build:
      context: .
      dockerfile: microservices/volatility-surface-builder/Dockerfile

  research-api:
    extends: { file: compose.base.yml, service: research-api }
    build:
      context: .
      dockerfile: microservices/research-api/Dockerfile
    environment:
      RESEARCH_DATABASE_URL: postgresql+psycopg://folio:localdev@database:5432/folio
      DATABASE_URL: postgresql://folio:localdev@database:5432/folio
      SERVICE_ASSERTION_SECRET: ${SERVICE_ASSERTION_SECRET:?Set a random 32-byte service assertion secret}
      ROBINHOOD_REDIRECT_URI: ${ROBINHOOD_REDIRECT_URI:-http://localhost:${HOST_PORT:-3100}/api/broker/robinhood/callback}
      AUTH_URL: ${AUTH_URL:-http://localhost:3100}
    ports:
      - "127.0.0.1:${RESEARCH_API_PORT:-8100}:8000"

  frontend:
    extends: { file: compose.base.yml, service: frontend }
    build: ./frontend
    environment:
      DATABASE_URL: postgresql://folio:localdev@database:5432/folio
      AUTH_SECRET: ${AUTH_SECRET:?Set a random auth secret}
      AUTH_URL: ${AUTH_URL:-http://localhost:3100}
      LOCAL_ACCOUNT_AUTH: ${LOCAL_ACCOUNT_AUTH:-false}

volumes:
  folio-local-data:
