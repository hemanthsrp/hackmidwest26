[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-tool"
version = "0.1.0"
description = "Shared Jev (TypeSafe System One) tool: Python functions and an MCP server for quick typed decisions."
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk==0.7.4",
    "mcp>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "strands-agents>=1.59"]

[project.scripts]
jev-tool-mcp = "jev_tool.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real TypeSafe API; needs TYPESAFE_API_KEY and JEV_ENABLED=true"]
