services:
  db:
    # Standard pgvector-enabled Postgres -- stand-in for the Akamai Managed
    # PostgreSQL cluster. Same engine, same schema.sql; swap the AKAMAI_DB_*
    # values in .env to point at the real Akamai cluster when it exists,
    # no code changes needed.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: scraper_analysis
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
