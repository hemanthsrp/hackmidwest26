services:
  db:
    # Standard pgvector-enabled Postgres -- stand-in for the Akamai Managed
    # PostgreSQL cluster. Same engine, same schema.sql; set DATABASE_URL in
    # .env to postgresql://scraper:localdev@localhost:5433/scraper_analysis
    # to use this, or to the real Akamai cluster URL -- no code changes
    # needed either way.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: scraper_analysis
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
