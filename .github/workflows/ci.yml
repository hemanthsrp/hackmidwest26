name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly, so a newly published vulnerability in a locked package fails CI
  # even when nobody has pushed.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Frontend build and security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev
        working-directory: frontend

  python-lock:
    name: Python lock and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: requirements/python.lock matches the pyproject.toml files
        run: |
          ./scripts/lock-python.sh
          git diff --exit-code requirements/python.lock || {
            echo "::error::requirements/python.lock is out of date; run scripts/lock-python.sh and commit it"; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: No known vulnerabilities in locked packages
        run: |
          python -m pip install pip-audit==2.9.0
          pip-audit -r requirements/python.lock --no-deps --disable-pip --progress-spinner off

  python:
    # One job per service, so a failure in one suite never hides the others.
    name: Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - research-api
          - decision-maker
          - jev-tool
          - scraper-analysis
          - agentic-search
          - yahoo-finance-mcp
          - volatility-surface-builder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install service packages and test dependencies
        # The services import each other (research-api -> decision-maker,
        # scraper-analysis -> jev-tool), so every job installs the full set,
        # at the exact versions in requirements/python.lock.
        run: >-
          python -m pip install -c requirements/python.lock
          -e 'microservices/research-api[dev]'
          -e 'microservices/decision-maker[pg,agent,dev]'
          -e 'microservices/jev-tool[dev]'
          -e 'microservices/scraper-analysis[dev]'
          -e 'microservices/agentic-search[dev]'
          -e 'microservices/yahoo-finance-mcp[dev]'
          -e 'microservices/volatility-surface-builder[dev]'
      - name: Test ${{ matrix.service }}
        run: python -m pytest -q
        working-directory: microservices/${{ matrix.service }}

  images:
    # The same builds the CD workflow publishes, without pushing: a Dockerfile
    # that no longer builds fails the PR instead of the deploy.
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: frontend, context: frontend, dockerfile: frontend/Dockerfile, target: runner }
          - { image: frontend-migrator, context: frontend, dockerfile: frontend/Dockerfile, target: migrator }
          - { image: research-api, context: ., dockerfile: microservices/research-api/Dockerfile, target: "" }
          - { image: scraper-analysis, context: ., dockerfile: microservices/scraper-analysis/Dockerfile, target: "" }
          - { image: volatility-surface-builder, context: ., dockerfile: microservices/volatility-surface-builder/Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-config:
    name: Deploy stack config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose.deploy.yml (and the compose.base.yml it extends) with placeholder values
        env:
          IMAGE_TAG: ci
          POSTGRES_PASSWORD: placeholder
          SERVICE_ASSERTION_SECRET: placeholder
          AUTH_SECRET: placeholder
          AUTH_URL: https://example.invalid
        run: docker compose -f compose.deploy.yml config --quiet
