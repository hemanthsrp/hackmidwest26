name: CD

# Publish: after CI passes on main, every image is pushed to GitHub Container
# Registry, tagged with the commit SHA and "main".
# Deploy: the published SHA is rolled out to one Docker host over SSH. It runs only
# when the repository variable DEPLOY_ENABLED is "true", and only through the
# "production" environment (add required reviewers there to approve each deploy).
# Setup and rollback: docs/DEPLOYMENT.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag (a commit SHA) to deploy instead of building. Use it to roll back."
        required: false
        default: ""

permissions:
  contents: read

# Deploys run one at a time, in order; a newer one waits rather than cancelling.
concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Publish (${{ matrix.image }})
    # Only a CI run that passed on a push to main, or a manual run without a tag.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.image_tag == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: frontend, context: frontend, dockerfile: frontend/Dockerfile, target: runner }
          - { image: frontend-migrator, context: frontend, dockerfile: frontend/Dockerfile, target: migrator }
          - { image: research-api, context: ., dockerfile: microservices/research-api/Dockerfile, target: "" }
          - { image: scraper-analysis, context: ., dockerfile: microservices/scraper-analysis/Dockerfile, target: "" }
          - { image: volatility-surface-builder, context: ., dockerfile: microservices/volatility-surface-builder/Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v7
        with:
          # The exact commit CI tested, not whatever main points at by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to production
    needs: publish
    # Runs after a publish, or alone for a manual rollback to an existing tag.
    if: >-
      always() && vars.DEPLOY_ENABLED == 'true' &&
      (needs.publish.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        inputs.image_tag != '' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/folio' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: |
            compose.deploy.yml
            compose.base.yml
          sparse-checkout-cone-mode: false
      - name: Check deploy settings
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in HOST USER KEY KNOWN; do [ -n "${!name}" ] || missing="$missing $name"; done
          if [ -n "$missing" ]; then
            echo "::error::Missing deploy secrets:$missing (see docs/DEPLOYMENT.md)"; exit 1
          fi
          case "$IMAGE_TAG" in *[!0-9a-f]*|"") echo "::error::image tag must be a commit SHA"; exit 1;; esac
      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Pinned host key: never trust a host on first sight in CI.
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
      - name: Roll out ${{ env.IMAGE_TAG }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          ssh_opts="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          # compose.deploy.yml extends compose.base.yml, so both go to the host.
          scp $ssh_opts compose.deploy.yml compose.base.yml "$USER@$HOST:$DEPLOY_PATH/"
          # The run's short-lived token pulls the images and is logged out right after,
          # so no registry credential stays on the host.
          printf '%s' "$REGISTRY_TOKEN" | ssh $ssh_opts "$USER@$HOST" \
            "cd '$DEPLOY_PATH' && docker login ghcr.io -u '$REGISTRY_USER' --password-stdin >/dev/null \
             && IMAGE_TAG='$IMAGE_TAG' docker compose -f compose.deploy.yml pull; status=\$?; \
             docker logout ghcr.io >/dev/null; exit \$status"
          ssh $ssh_opts "$USER@$HOST" \
            "cd '$DEPLOY_PATH' && IMAGE_TAG='$IMAGE_TAG' docker compose -f compose.deploy.yml up -d --wait --wait-timeout 300 \
             && echo '$IMAGE_TAG' > DEPLOYED_TAG"
      - name: Smoke check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "cd '$DEPLOY_PATH' && port=\$(grep -E '^HOST_PORT=' .env | cut -d= -f2); \
             curl --fail --silent --show-error --max-time 10 http://127.0.0.1:\${port:-3100}/api/health"
