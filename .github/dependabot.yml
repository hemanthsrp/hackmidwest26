# Weekly update PRs. Minor and patch bumps are grouped into one PR per ecosystem;
# each major bump gets its own PR. CI must pass before anything merges.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Types for the Node 24 runtime the images use.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  # requirements/python.lock is generated by scripts/lock-python.sh; CI's
  # "Python lock and audit" job rejects a bump that the pyproject ranges don't allow.
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /frontend
      - /microservices/research-api
      - /microservices/scraper-analysis
      - /microservices/volatility-surface-builder
    schedule:
      interval: weekly
    # The runtimes are deliberate: Python 3.12 (requirements/python.lock is resolved
    # for it) and Node 24 (@types/node matches it). Take digest and patch updates
    # only; move a runtime on purpose, with the lock and types, in its own PR.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
